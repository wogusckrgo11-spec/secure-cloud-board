# /etc/nginx/conf.d/board.conf
#
# Nginx(퍼블릭 서브넷) : 80 수신 → Gunicorn(127.0.0.1:5000) 리버스 프록시
# 설치 후:
#   sudo nginx -t && sudo systemctl reload nginx

upstream board_app {
  server 127.0.0.1:5000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;            # 실제 도메인이 있으면 교체

  # 요청 본문 크기 제한 (과도한 입력 방어)
  client_max_body_size 1m;

  # 정적 파일은 Nginx 가 직접 서빙 (Flask 로 넘기지 않음)
  location /static/ {
    alias /opt/board/static/;
    expires 7d;
    access_log off;
  }

  location / {
    proxy_pass http://board_app;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
  }

  # [확장 지점] HTTPS 적용 시:
  #   1) certbot(Let's Encrypt) 으로 인증서 발급
  #   2) listen 443 ssl; 블록 추가 + ssl_certificate 지정
  #   3) 이 80 블록은 https 로 return 301 redirect
}
